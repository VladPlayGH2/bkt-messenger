services:
  - type: web
    name: bkt-messenger
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bkt-messenger-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: VAPID_SUBJECT
        value: mailto:admin@example.com
      # Add a TURN provider for reliable PC↔phone calls across restrictive NATs.
      # Set these in Render Dashboard as secret environment variables.
      - key: TURN_HOST
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_SECRET
        sync: false

databases:
  - name: bkt-messenger-db
    databaseName: bkt_messenger
    user: bkt_messenger
