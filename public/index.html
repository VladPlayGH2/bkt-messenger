<style>
*{box-sizing:border-box}body{margin:0;background:#020403;color:#f4f7f5;font:15px Arial,sans-serif}
button,input{font:inherit}.app{height:100vh;max-width:1100px;margin:auto;display:grid;grid-template-columns:330px 1fr;background:#050807}
.sidebar{border-right:1px solid #1b2822;display:flex;flex-direction:column}.top{padding:22px 20px 12px}.brand{display:flex;gap:12px;align-items:center}.logo{width:50px;height:50px;border-radius:15px;background:linear-gradient(145deg,#2aff78,#07963b);color:#031108;display:grid;place-items:center;font-weight:900}.brand h1{margin:0;font-size:24px}.brand small{color:#8d9893}.search{margin:12px 18px;background:#111716;border:1px solid #202b27;border-radius:16px;padding:12px}.search input,.auth input{width:100%;background:transparent;border:0;outline:0;color:#fff}.users{overflow:auto}.user{padding:14px 18px;border-bottom:1px solid #17211c;cursor:pointer}.user:hover,.user.active{background:#0d1812}.dot{color:#22ff72}.chat{display:flex;flex-direction:column;min-width:0}.chathead{height:76px;padding:12px 18px;border-bottom:1px solid #1b2822;display:flex;align-items:center;gap:12px}.chathead b{display:block}.status{color:#22ff72;font-size:12px}.avatar{width:45px;height:45px;border-radius:50%;background:#0c6630;display:grid;place-items:center;font-weight:bold}.messages{flex:1;overflow:auto;padding:24px;background:radial-gradient(circle at 80% 20%,rgba(0,255,90,.05),transparent 30%)}.bubble{max-width:70%;padding:10px 13px;margin:0 0 10px;border-radius:15px;background:#111816}.bubble.me{margin-left:auto;background:#0b6630}.bubble time{display:block;text-align:right;color:#a1b0a7;font-size:10px;margin-top:4px}.sendbar{display:flex;gap:8px;padding:12px;border-top:1px solid #1b2822}.sendbar input{flex:1;background:#111716;border:1px solid #24312b;border-radius:22px;padding:12px 15px;color:white;outline:0}.send{border:0;border-radius:50%;width:45px;background:#22ff72;cursor:pointer}.empty{margin:auto;text-align:center;color:#8d9893}.auth{position:fixed;inset:0;background:#020403;display:grid;place-items:center}.card{width:min(390px,92vw);background:#0c1110;border:1px solid #1b2822;border-radius:22px;padding:28px;box-shadow:0 0 60px rgba(0,255,90,.08)}.card h2{margin-top:0}.auth input{background:#111716;border:1px solid #24312b;border-radius:13px;padding:13px;margin:7px 0}.primary{width:100%;border:0;border-radius:13px;padding:13px;margin-top:10px;background:#22ff72;color:#001609;font-weight:bold;cursor:pointer}.switch{color:#22ff72;text-align:center;cursor:pointer;margin-top:16px}.error{color:#ff8d8d;min-height:20px}@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{display:flex}.chat{display:none}.app.mobile-chat .sidebar{display:none}.app.mobile-chat .chat{display:flex}.chathead .back{display:block}.chathead{height:68px}.bubble{max-width:82%}}
#videoPreview{width:110px;height:110px;border-radius:50%;object-fit:cover;background:#020403}
#videoRecording{align-items:center}
@media(max-width:700px){.app.mobile-chat .sidebar{display:none}.app.mobile-chat .chat{display:flex}}
.verified-badge{display:inline-grid;place-items:center;width:17px;height:17px;margin-left:4px;border-radius:50%;background:#2388ff;color:#fff;font-size:11px;font-weight:900;vertical-align:middle}
.group-item{padding:12px 16px;border-radius:12px;cursor:pointer;margin:3px 10px}
.group-item:hover{background:#142019}
.verified-badge{display:inline-grid;place-items:center;width:17px;height:17px;margin-left:4px;border-radius:50%;background:#2388ff;color:#fff;font-size:11px;font-weight:900;vertical-align:middle}.group-item{padding:10px 18px;cursor:pointer;border-bottom:1px solid #17211c}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:20}.modal-card{width:min(420px,92vw);background:#0c1110;border:1px solid #24312b;border-radius:18px;padding:22px}.modal-card input,.modal-card textarea{width:100%;background:#111716;border:1px solid #24312b;border-radius:10px;padding:11px;color:#fff;margin:6px 0 12px}.modal-actions{display:flex;gap:8px}.modal-actions button{flex:1;padding:11px;border:0;border-radius:10px;cursor:pointer}</style>
<style id="bkt-mobile-css">
html,body{width:100%;height:100%;margin:0}
*{box-sizing:border-box}
button,input,textarea{font:inherit}
button{touch-action:manipulation}
@media (max-width:700px){
html,body{overflow:hidden}
#app{width:100vw!important;height:100dvh!important;min-height:100dvh!important}
input,textarea{font-size:16px!important}
button{min-height:44px;min-width:44px;padding:9px 12px}
#messages{padding:10px 8px 90px!important;-webkit-overflow-scrolling:touch}
#users{overflow-y:auto;-webkit-overflow-scrolling:touch}
.user,.chat-item,.group-item{min-height:58px;padding:10px 12px}
.composer,.message-input,.input-row{position:sticky;bottom:0;z-index:20;padding:8px!important;padding-bottom:max(8px,env(safe-area-inset-bottom))!important}
#text{min-height:44px;max-height:120px}
.modal,.settings-modal{width:calc(100vw - 20px)!important;max-width:520px!important;max-height:90dvh!important;overflow:auto!important}
#remoteCallVideo{width:calc(100vw - 30px)!important;max-width:none!important;right:15px!important;bottom:90px!important}

<style id="bkt-usability-css">
.bubble{position:relative;word-break:break-word}
.bubble audio,.bubble video{max-width:100%}
@media(max-width:700px){
  .sidebar{min-height:100dvh}
  .sendbar{padding-bottom:max(12px,env(safe-area-inset-bottom))}

<body>
<div id="auth" class="auth"><div class="card">
<div class="brand"><div class="logo">БКТ</div><div><h1>БКТ</h1><small>Мессенджер</small></div></div>
<h2 id="authTitle">Вход</h2><div id="err" class="error"></div>
<input id="login" placeholder="Логин" autocomplete="username"><input id="pass" type="password" placeholder="Пароль" autocomplete="current-password">
<button class="primary" onclick="authAction()" id="authBtn">Войти</button><div class="switch" onclick="toggleAuth()" id="switch">Нет аккаунта? Регистрация</div>
</div></div><div class="app" id="app" style="display:none">
<aside class="sidebar"><button id="profileBtn" onclick="openSettings()" style="margin:0 18px 10px;padding:10px;border:1px solid #24312b;background:#111716;color:#fff;border-radius:12px;cursor:pointer">⚙️ Настройки профиля</button><button onclick="createGroup()" style="margin:0 18px 10px;padding:10px;border:0;border-radius:12px;cursor:pointer">＋ Создать группу</button><div class="top"><div class="brand"><div class="logo">БКТ</div><div><h1>БКТ</h1><small id="me"></small></div></div></div>
<div class="search"><input id="search" placeholder="Найти пользователя по @username" oninput="loadUsers()"></div><div id="groups"></div><div id="users" class="users"></div></aside>
<main class="chat"><div class="chathead"><button class="back" onclick="mobileBack()" style="display:none">‹</button><div class="avatar" id="headAvatar">БКТ</div><div><b id="headName">Выберите чат</b><span class="status" id="headStatus"></span></div></div>
<div id="messages" class="messages"><div class="empty">Выберите пользователя слева</div></div>
<div class="sendbar">
<button id="voiceButton" title="Голосовое сообщение">🎙️</button>
<button id="videoNoteButton" title="Видеосообщение">🎥</button>
<button id="audioCallButton" title="Аудиозвонок">📞</button>
<button id="videoCallButton" title="Видеозвонок">📹</button>
<input id="text" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')send()">
<button class="send" onclick="send()">➤</button>
</div>
<div id="recording" class="modal" style="display:none"><div class="modal-card"><h3>🎙️ Запись голосового</h3><div id="recordTime">0:00</div><div class="modal-actions"><button onclick="finishRecording()">Отправить</button><button onclick="cancelRecording()">Отмена</button></div></div></div>
<div id="videoRecording" class="modal" style="display:none"><div class="modal-card"><h3>🎥 Видеосообщение</h3><video id="videoPreview" autoplay muted playsinline></video><div id="videoTime">0:00</div><div class="modal-actions"><button onclick="finishVideoRecording()">Отправить</button><button onclick="cancelVideoRecording()">Отмена</button></div></div></div>
<div id="callModal" class="modal" style="display:none"><div class="modal-card"><h3 id="callTitle">Звонок</h3><video id="remoteVideo" autoplay playsinline style="width:100%;max-height:320px;border-radius:14px;background:#000"></video><audio id="remoteAudio" autoplay></audio><div class="modal-actions"><button id="acceptCall" onclick="acceptIncomingCall()">Принять</button><button onclick="endCall()">Завершить</button></div></div></div></main></div>
<div id="settingsModal" class="modal"><div class="modal-card"><h2>Настройки профиля</h2><label>Логин</label><input id="profileUsername"><label>О себе</label><textarea id="profileBio" maxlength="160"></textarea><label>Аватар (ссылка)</label><input id="profileAvatar" placeholder="https://..."><div id="settingsError" class="error"></div><div class="modal-actions"><button onclick="saveSettings()">Сохранить</button><button onclick="closeSettings()">Отмена</button><button onclick="logout()" style="background:#a92323;color:#fff">Выйти</button></div></div></div>
<script>
let token=localStorage.getItem("bkt_token"), me=null, selected=null, activeGroup=null, socket=null, registering=false;
const $=id=>document.getElementById(id);
function toggleAuth(){registering=!registering;$("authTitle").textContent=registering?"Регистрация":"Вход";$("authBtn").textContent=registering?"Создать аккаунт":"Войти";$("switch").textContent=registering?"Уже есть аккаунт? Войти":"Нет аккаунта? Регистрация";$("err").textContent=""}
async function api(path, options={}){
  const saved=localStorage.getItem("bkt_token");
  if(saved) token=saved;
  const headers={...(options.headers||{})};
  if(token) headers.Authorization="Bearer "+token;
  if(options.body && typeof options.body!=="string"){
    headers["Content-Type"]="application/json";
    options={...options,body:JSON.stringify(options.body)};
  }
  const res=await fetch(path,{...options,headers});
  const text=await res.text();
  let data={};
  try{ data=text?JSON.parse(text):{}; }catch(_){ throw new Error("Сервер вернул неверный ответ ("+res.status+")"); }
  if(!res.ok) throw new Error(data.error||data.message||("Ошибка "+res.status));
  return data;
}


async function authAction(){
  const username=$("login").value.trim();
  const password=$("pass").value;
  $("err").textContent="";
  if(!username||!password){$("err").textContent="Введите логин и пароль";return;}
  try{
    const d=await api("/api/"+(registering?"register":"login"),{
      method:"POST",
      body:{username,password}
    });
    token=d.token;
    localStorage.setItem("bkt_token",token);
    await start();
  }catch(e){
    $("err").textContent=e.message||"Ошибка авторизации";
  }
}

async function start(){
  if(!token) return;
  try{
    me=await api("/api/me");
    $("auth").style.display="none";
    $("app").style.display="grid";
    $("me").textContent="@"+(me.username||"");
    connectSocket();
    loadUsers();
    loadGroups();
  }catch(e){
    localStorage.removeItem("bkt_token");
    token=null;
    me=null;
    $("app").style.display="none";
    $("auth").style.display="grid";
    $("err").textContent="";
  }
}

function connectSocket(){
  try{ if(socket) socket.close(); }catch(_){}
  const scheme=location.protocol==="https:"?"wss://":"ws://";
  socket=new WebSocket(scheme+location.host+"/?token="+encodeURIComponent(token));
  socket.onopen=()=>{};
  socket.onmessage=e=>{
    try{
      const d=JSON.parse(e.data);
      if(d.type==="call-signal"){handleCallSignal(d);return;}
      if(d.type==="message" && d.message) {
        if(selected && (Number(d.message.sender_id)===Number(selected.id) || Number(d.message.receiver_id)===Number(selected.id)))
          renderMessage(d.message);
        return;
      }
      if(d.type==="message-deleted"){
        const el=document.getElementById("m"+d.messageId); if(el) el.remove();
        return;
      }
      if(d.type==="group-message" && d.message && activeGroup && Number(d.message.group_id)===Number(activeGroup.id)){
        renderGroupMessage(d.message);
        return;
      }
      if(d.type==="group-message-deleted"){
        const el=document.getElementById("gm"+d.messageId); if(el) el.remove();
        return;
      }
    }catch(err){console.error("WebSocket message error:",err);}
  };
  socket.onclose=()=>{};
  socket.onerror=()=>{};
}

function verifiedName(name, verified){
  const safe=escapeHtml(String(name||""));
  return safe+(verified?'<span class="verified-badge" title="Подтверждено">✓</span>':"");
}

async function loadUsers(){
  const input = $("search");
  const q = (input?.value || "").trim().replace(/^@+/,"");
  const box = $("users");
  if (!box) return;

  if (!q) {
    box.innerHTML = "";
    return;
  }

  try {
    const list = await api("/api/users/search?q="+encodeURIComponent(q));
    box.innerHTML = "";
    if (!list.length) {
      box.innerHTML = '<div style="padding:14px;color:#8d9893">Никого не найдено. Проверь @username.</div>';
      return;
    }

    for (const u of list) {
      const row = document.createElement("div");
      row.className = "user";
      row.onclick = () => openUser(u);
      const initial = escapeHtml((u.username || "?")[0].toUpperCase());
      const avatar = u.avatar
        ? `<img src="${escapeHtml(u.avatar)}" style="width:42px;height:42px;border-radius:50%;object-fit:cover">`
        : initial;
      row.innerHTML =
        `<div class="avatar">${avatar}</div>` +
        `<div><b>${verifiedName(u.username, !!u.verified)}</b><small>@${escapeHtml(u.username)}</small></div>`;
      box.appendChild(row);
    }
  } catch(e) {
    box.innerHTML = '<div style="padding:14px;color:#ff8d8d">'+escapeHtml(e.message||"Ошибка поиска")+'</div>';
  }
}
async function loadGroups(){
 try{const gs=await api('/api/groups');$("groups").innerHTML=gs.map(g=>`<div class="group-item" onclick='openGroup(${JSON.stringify(g)})'>👥 ${escapeHtml(g.name)}<small style="display:block;color:#8d9893">${Array.isArray(g.members) ? g.members.length : 1} участников</small></div>`).join('')}catch(e){console.error(e)}
}
async function createGroup(){
 const name=prompt('Название группы:'); if(!name||!name.trim())return;
 const raw=prompt('Введите @username участников через запятую:')||''; const ids=[];
 for(const n0 of raw.split(',')){const n=n0.trim().replace(/^@+/,'');if(!n)continue;try{const a=await api('/api/users?q='+encodeURIComponent(n));const u=a.find(x=>x.username.toLowerCase()===n.toLowerCase())||a[0];if(u)ids.push(u.id)}catch{}}
 try{const g=await api('/api/groups',{method:'POST',body:JSON.stringify({name:name.trim(),memberIds:ids})});openGroup(g);loadGroups()}catch(e){alert(e.message)}
}
async function openGroup(g){activeGroup=g;selected=null;$("app").classList.add('mobile-chat');$("headName").textContent=g.name;$("headAvatar").textContent='👥';$("headStatus").textContent=` ${g.members.length} участников`;const ms=await api('/api/groups/'+g.id+'/messages');$("messages").innerHTML='';ms.forEach(renderGroupMessage)}
function renderGroupMessage(m){
  if($("gm"+m.id))return;
  const d=document.createElement("div"); d.id="gm"+m.id; d.className="bubble "+(Number(m.sender_id)===Number(me.id)?"me":"");
  const w=document.createElement("div"); w.style.fontSize="12px"; w.style.opacity=".7"; w.textContent=m.sender_name; d.appendChild(w);
  const t=document.createElement("div"); t.textContent=m.text; d.appendChild(t);
  const meta=document.createElement("div"); meta.style.display="flex"; meta.style.justifyContent="flex-end"; meta.style.gap="6px";
  if(Number(m.sender_id)===Number(me.id)){
    const del=document.createElement("button"); del.type="button"; del.title="Удалить сообщение"; del.textContent="×";
    del.style.cssText="border:0;background:transparent;color:#a1b0a7;cursor:pointer;font-size:16px;padding:0 2px";
    del.onclick=()=>deleteGroupMessage(m.id); meta.appendChild(del);
  }
  d.appendChild(meta); $("messages").appendChild(d); $("messages").scrollTop=$("messages").scrollHeight;
}
async function deleteGroupMessage(id){
  if(!confirm("Удалить это сообщение?"))return;
  try{await api("/api/groups/messages/"+id,{method:"DELETE"});const el=$("gm"+id);if(el)el.remove();}
  catch(e){alert(e.message||"Не удалось удалить сообщение");}
}
async function openUser(u){activeGroup=null;selected=u;$("app").classList.add("mobile-chat");$("headName").textContent=u.username;$("headAvatar").textContent=u.username[0].toUpperCase();$("headStatus").textContent=" ● онлайн";let ms=await api("/api/messages/"+u.id);$("messages").innerHTML="";ms.forEach(renderMessage);$("messages").scrollTop=$("messages").scrollHeight;loadUsers()}
function renderMessage(m){
  if(document.getElementById("m"+m.id))return;
  const d=document.createElement("div");
  d.id="m"+m.id;
  d.className="bubble "+(Number(m.sender_id)===Number(me.id)?"me":"");

  if(m.text.startsWith("[VOICE]")){
    const audio=document.createElement("audio");
    audio.controls=true; audio.preload="metadata"; audio.src=m.text.substring(7);
    audio.style.maxWidth="230px"; d.appendChild(audio);
  } else if(m.text.startsWith("[VIDEO_NOTE]")){
    const video=document.createElement("video");
    video.controls=true; video.playsInline=true; video.preload="metadata";
    video.src=m.text.substring(12); video.style.width="180px"; video.style.height="180px";
    video.style.objectFit="cover"; video.style.borderRadius="50%"; video.style.display="block";
    d.appendChild(video);
  } else {
    const body=document.createElement("div");
    body.textContent=m.text; d.appendChild(body);
  }

  const meta=document.createElement("div");
  meta.style.display="flex"; meta.style.alignItems="center"; meta.style.justifyContent="flex-end"; meta.style.gap="6px";
  const t=document.createElement("time");
  t.textContent=new Date(m.created_at.replace(" ","T")+"Z").toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  meta.appendChild(t);
  if(Number(m.sender_id)===Number(me.id)){
    const del=document.createElement("button");
    del.type="button"; del.title="Удалить сообщение"; del.textContent="×";
    del.style.cssText="border:0;background:transparent;color:#a1b0a7;cursor:pointer;font-size:16px;padding:0 2px;line-height:1";
    del.onclick=()=>deleteMessage(m.id);
    meta.appendChild(del);
  }
  d.appendChild(meta);
  $("messages").appendChild(d);
  $("messages").scrollTop=$("messages").scrollHeight;
}

async function deleteMessage(id){
  if(!confirm("Удалить это сообщение?"))return;
  try{
    await api("/api/messages/"+id,{method:"DELETE"});
    const el=document.getElementById("m"+id); if(el) el.remove();
  }catch(e){alert(e.message||"Не удалось удалить сообщение");}
}

function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function mobileBack(){$("app").classList.remove("mobile-chat");loadUsers();}


let voiceRecorder=null, voiceChunks=[], voiceStream=null, voiceTimer=null, voiceSeconds=0;
let videoRecorder=null, videoChunks=[], videoStream=null, videoTimer=null, videoSeconds=0;

if(document.getElementById("voiceButton"))document.getElementById("voiceButton").addEventListener("click", startVoiceRecording);
if(document.getElementById("videoNoteButton"))document.getElementById("videoNoteButton").addEventListener("click", startVideoRecording);

function pickMime(types){
  return types.find(x=>MediaRecorder.isTypeSupported(x)) || "";
}

async function startVoiceRecording(){
  if(!selected)return alert("Сначала выберите чат");
  try{
    voiceStream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=pickMime(["audio/webm;codecs=opus","audio/mp4"]);
    voiceRecorder=new MediaRecorder(voiceStream,mime?{mimeType:mime}:undefined);
    voiceChunks=[];
    voiceRecorder.ondataavailable=e=>{if(e.data.size)voiceChunks.push(e.data)};
    voiceRecorder.start();
    voiceSeconds=0;
    $("recording").style.display="flex";
    $("voiceButton").classList.add("recording-active");
    voiceTimer=setInterval(()=>{
      voiceSeconds++;
      $("recordTime").textContent=`${Math.floor(voiceSeconds/60)}:${String(voiceSeconds%60).padStart(2,"0")}`;
      if(voiceSeconds>=120)finishRecording();
    },1000);
  }catch(e){console.error(e);alert("Разреши доступ к микрофону.")}
}

async function finishRecording(){
  if(!voiceRecorder)return;
  clearInterval(voiceTimer);
  const rec=voiceRecorder;
  const stream=voiceStream;
  rec.onstop=async()=>{
    stream.getTracks().forEach(t=>t.stop());
    const blob=new Blob(voiceChunks,{type:rec.mimeType||"audio/webm"});
    await uploadMediaFile(blob,"audio");
    voiceRecorder=null;voiceStream=null;voiceChunks=[];
  };
  rec.stop();
  $("recording").style.display="none";
  $("voiceButton").classList.remove("recording-active");
}

function cancelRecording(){
  if(voiceRecorder)voiceRecorder.stop();
  if(voiceStream)voiceStream.getTracks().forEach(t=>t.stop());
  clearInterval(voiceTimer);
  voiceRecorder=null;voiceStream=null;voiceChunks=[];
  $("recording").style.display="none";
  $("voiceButton").classList.remove("recording-active");
}

async function startVideoRecording(){
  if(!selected)return alert("Сначала выберите чат");
  try{
    videoStream=await navigator.mediaDevices.getUserMedia({audio:true,video:true});
    const mime=pickMime(["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm","video/mp4"]);
    videoRecorder=new MediaRecorder(videoStream,mime?{mimeType:mime}:undefined);
    videoChunks=[];
    $("videoPreview").srcObject=videoStream;
    $("videoPreview").play().catch(()=>{});
    videoRecorder.ondataavailable=e=>{if(e.data.size)videoChunks.push(e.data)};
    videoRecorder.start();
    videoSeconds=0;
    $("videoRecording").style.display="flex";
    videoTimer=setInterval(()=>{
      videoSeconds++;
      $("videoTime").textContent=`${Math.floor(videoSeconds/60)}:${String(videoSeconds%60).padStart(2,"0")}`;
      if(videoSeconds>=60)finishVideoRecording();
    },1000);
  }catch(e){console.error(e);alert("Разреши доступ к камере и микрофону.")}
}

async function finishVideoRecording(){
  if(!videoRecorder)return;
  clearInterval(videoTimer);
  const rec=videoRecorder, stream=videoStream;
  rec.onstop=async()=>{
    stream.getTracks().forEach(t=>t.stop());
    const blob=new Blob(videoChunks,{type:rec.mimeType||"video/webm"});
    await uploadMediaFile(blob,"video");
    videoRecorder=null;videoStream=null;videoChunks=[];
    $("videoPreview").srcObject=null;
  };
  rec.stop();
  $("videoRecording").style.display="none";
}

function cancelVideoRecording(){
  if(videoRecorder)videoRecorder.stop();
  if(videoStream)videoStream.getTracks().forEach(t=>t.stop());
  clearInterval(videoTimer);
  videoRecorder=null;videoStream=null;videoChunks=[];
  $("videoPreview").srcObject=null;
  $("videoRecording").style.display="none";
}

async function uploadMediaFile(blob,kind){
  if(!selected)return;
  const form=new FormData();
  const ext=blob.type.includes("mp4")?"mp4":"webm";
  form.append("media",blob,`${kind}-${Date.now()}.${ext}`);
  form.append("receiverId",selected.id);
  form.append("kind",kind);
  try{
    const r=await fetch("/api/media",{method:"POST",headers:{Authorization:"Bearer "+token},body:form});
    const msg=await r.json();
    if(!r.ok)throw Error(msg.error||"Ошибка отправки");
    // The WebSocket may deliver the same message; renderMessage ignores duplicates.
    renderMessage(msg);
  }catch(e){console.error(e);alert("Не удалось отправить: "+e.message)}
}

let peer=null, localCallStream=null, incomingCall=null, callType="audio", pendingIceCandidates=[], incomingIceCandidates=[], callPeerUserId=null;

function callSocket(data){
  if(!socket || socket.readyState!==WebSocket.OPEN){
    throw new Error("Нет соединения с сервером. Перезагрузи страницу.");
  }
  socket.send(JSON.stringify(data));
}

async function startCall(type){
  if(!selected)return alert("Сначала выберите чат");
  if(!navigator.mediaDevices || !window.RTCPeerConnection)
    return alert("Звонки не поддерживаются этим браузером");
  try{
    callType=type;
    await loadRtcConfig();
    localCallStream=await navigator.mediaDevices.getUserMedia(
      type==="video"?{audio:true,video:true}:{audio:true}
    );
    peer=createPeer();
    pendingIceCandidates=[];
    incomingIceCandidates=[];
    callPeerUserId=Number(selected.id);
    localCallStream.getTracks().forEach(t=>peer.addTrack(t,localCallStream));
    $("callTitle").textContent=type==="video"?"📹 Видеозвонок":"📞 Аудиозвонок";
    $("callModal").style.display="grid";
    if(type==="video"){
      $("remoteVideo").style.display="block";
      $("remoteVideo").muted=true;
      $("remoteVideo").srcObject=localCallStream;
    }else{
      $("remoteVideo").style.display="none";
    }
    const offer=await peer.createOffer();
    await peer.setLocalDescription(offer);
    callSocket({type:"call-signal",toUserId:Number(selected.id),signalType:"offer",signal:{sdp:peer.localDescription.sdp,type:peer.localDescription.type},callType:type});
  }catch(e){
    console.error(e); endCall(false);
    alert("Не удалось начать звонок. Разреши доступ к микрофону/камере.");
  }
}

let rtcConfig={iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun1.l.google.com:19302"}
]};
async function loadRtcConfig(){
  try{ const c=await api("/api/rtc-config"); if(Array.isArray(c.iceServers)&&c.iceServers.length) rtcConfig=c; }catch(_){}
}
function createPeer(){
  const pc=new RTCPeerConnection(rtcConfig);
  pc.onicecandidate=e=>{
    if(e.candidate && callPeerUserId)
      callSocket({type:"call-signal",toUserId:Number(callPeerUserId),signalType:"ice",signal:e.candidate});
  };
  pc.ontrack=e=>{
    const stream=e.streams[0];
    $("remoteAudio").srcObject=stream;
    if(callType==="video"){$("remoteVideo").srcObject=stream;$("remoteVideo").muted=false;}
    $("remoteAudio").play().catch(()=>{});
    $("remoteVideo").play().catch(()=>{});
  };
  pc.onconnectionstatechange=()=>{
    if(["failed","disconnected","closed"].includes(pc.connectionState)) endCall(false);
  };
  return pc;
}

async function acceptIncomingCall(){
  if(!incomingCall)return;
  try{
    const from=incomingCall.fromUserId;
    callType=incomingCall.callType||"audio";
    selected={id:from,username:incomingCall.fromUsername};
    localCallStream=await navigator.mediaDevices.getUserMedia(
      callType==="video"?{audio:true,video:true}:{audio:true}
    );
    peer=createPeer();
    callPeerUserId=Number(from);
    localCallStream.getTracks().forEach(t=>peer.addTrack(t,localCallStream));
    await peer.setRemoteDescription(new RTCSessionDescription(incomingCall.signal));
    for(const c of incomingIceCandidates){try{await peer.addIceCandidate(new RTCIceCandidate(c))}catch(e){}}
    incomingIceCandidates=[];
    const answer=await peer.createAnswer();
    await peer.setLocalDescription(answer);
    callSocket({type:"call-signal",toUserId:from,signalType:"answer",signal:{sdp:peer.localDescription.sdp,type:peer.localDescription.type},callType});
    incomingCall=null;
    $("acceptCall").style.display="none";
    $("callTitle").textContent=callType==="video"?"📹 Видеозвонок":"📞 Аудиозвонок";
    $("remoteVideo").style.display=callType==="video"?"block":"none";
  }catch(e){
    console.error(e); endCall(false); alert("Не удалось принять звонок.");
  }
}

async function handleCallSignal(d){
  if(d.signalType==="offer"){
    incomingCall=d;
    callType=d.callType||"audio";
    $("callTitle").textContent=`Входящий ${callType==="video"?"видеозвонок":"аудиозвонок"} от @${d.fromUsername||""}`;
    $("acceptCall").style.display="block";
    $("remoteVideo").style.display=callType==="video"?"block":"none";
    $("callModal").style.display="grid";
  }else if(d.signalType==="answer" && peer){
    await peer.setRemoteDescription(new RTCSessionDescription(d.signal));
  }else if(d.signalType==="ice"){
    if(peer && peer.remoteDescription){
      try{await peer.addIceCandidate(new RTCIceCandidate(d.signal));}catch(e){}
    }else{
      incomingIceCandidates.push(d.signal);
    }
  }else if(d.signalType==="unavailable"){
    alert("Пользователь сейчас не в сети или не подключён к звонкам.");
    endCall(false);
  }else if(d.signalType==="hangup"){
    endCall(false);
  }
}

function endCall(notify=true){
  if(notify && callPeerUserId && socket && socket.readyState===WebSocket.OPEN)
    callSocket({type:"call-signal",toUserId:Number(callPeerUserId),signalType:"hangup",signal:{}});
  try{if(peer)peer.close()}catch(e){}
  if(localCallStream)localCallStream.getTracks().forEach(t=>t.stop());
  peer=null;localCallStream=null;incomingCall=null;pendingIceCandidates=[];incomingIceCandidates=[];callPeerUserId=null;
  $("callModal").style.display="none";
  $("remoteVideo").srcObject=null;
  $("remoteAudio").srcObject=null;
  $("acceptCall").style.display="block";
}

$("audioCallButton").onclick=()=>startCall("audio");
$("videoCallButton").onclick=()=>startCall("video");

  const saved=localStorage.getItem("bkt_token");
  if(!saved) return;
  token=saved;
  await start();
}
document.addEventListener("DOMContentLoaded",restoreSession);
